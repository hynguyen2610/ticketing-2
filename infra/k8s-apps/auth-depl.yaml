apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: bluestorm1288/ticketing-auth:latest
          env:
            - name: MONGO_URI
              value: 'mongodb://auth-mongo-srv:27017/auth'
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_DOMAIN
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_CLIENT_ID
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_CLIENT_SECRET
            - name: AUTH0_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_CALLBACK_URL
            - name: AUTH0_LOGOUT_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_LOGOUT_REDIRECT_URL
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: auth0-secret-ticketing
                  key: AUTH0_AUDIENCE
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000
