apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-auth-mongo
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: default
    name: auth-mongo-pvc
  hostPath:
    path: /tmp/k8s-pv/auth-mongo
    type: DirectoryOrCreate
---
