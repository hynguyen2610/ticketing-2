apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: default
type: Opaque
stringData:
  # Use keys from the same Stripe account and mode.
  # Example shapes:
  #   STRIPE_KEY: sk_test_...
  #   NEXT_PUBLIC_STRIPE_PUB_KEY: pk_test_...
  STRIPE_KEY: <your-stripe-secret-key>
  NEXT_PUBLIC_STRIPE_PUB_KEY: <your-stripe-publishable-key>
