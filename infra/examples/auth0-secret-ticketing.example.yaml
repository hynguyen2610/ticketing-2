apiVersion: v1
kind: Secret
metadata:
  name: auth0-secret-ticketing
  namespace: default
type: Opaque
stringData:
  # Replace these placeholder values with your Auth0 tenant and app configuration.
  AUTH0_DOMAIN: YOUR_AUTH0_DOMAIN
  AUTH0_CLIENT_ID: YOUR_AUTH0_CLIENT_ID
  AUTH0_CLIENT_SECRET: YOUR_AUTH0_CLIENT_SECRET
  AUTH0_CALLBACK_URL: http://localhost:3000/auth/callback
  AUTH0_LOGOUT_REDIRECT_URL: http://localhost:3000
  # Optional. Leave blank or remove this key unless you configured an Auth0 API audience.
  AUTH0_AUDIENCE: ""
