apiVersion: skaffold/v2alpha3
kind: Config
deploy:
  kubectl:
    manifests:
      - ./infra/k8s/*
      - ./infra/k8s-dev/*
build:
  tagPolicy:
    gitCommit: {}
  local:
    push: false
  artifacts:
    - image: bluestorm1288/ticketing-auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/ticketing-client
      context: client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: '**/*.js'
            dest: .
    - image: bluestorm1288/ticketing-tickets
      context: tickets
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/ticketing-orders
      context: orders
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/ticketing-expiration
      context: expiration
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/ticketing-payment
      context: payment
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/image-management-backend
      context: image-management/backend
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: bluestorm1288/iman-front
      context: image-management/frontend
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.js'
            dest: .
profiles:
  - name: cluster-registry
    build:
      local:
        push: true
  - name: cluster-docker
    build:
      local:
        push: true
  - name: cluster-builder
    patches:
      - op: remove
        path: /build/artifacts/0/docker
      - op: add
        path: /build/artifacts/0/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/1/docker
      - op: add
        path: /build/artifacts/1/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/2/docker
      - op: add
        path: /build/artifacts/2/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/3/docker
      - op: add
        path: /build/artifacts/3/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/4/docker
      - op: add
        path: /build/artifacts/4/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/5/docker
      - op: add
        path: /build/artifacts/5/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/6/docker
      - op: add
        path: /build/artifacts/6/kaniko
        value:
          dockerfile: Dockerfile
      - op: remove
        path: /build/artifacts/7/docker
      - op: add
        path: /build/artifacts/7/kaniko
        value:
          dockerfile: Dockerfile
    build:
      cluster:
        namespace: default
        concurrency: 1
        timeout: 30m
